[project]
name = "undercurrents"
version = "0.1.0"
description = "Multi-agent system exploring 18 years of Tame Impala setlists"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "truststore>=0.10.4",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "holidays>=0.104",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undercurrents"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Needed on machines behind a corporate proxy/custom CA that break uv's bundled
# certificate store; harmless on unrestricted networks.
[tool.uv]
native-tls = true
